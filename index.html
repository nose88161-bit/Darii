</div><style>* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #05050a;
  font-family: Arial, sans-serif;
  color: white;
  padding: 24px;
}

.menu-container {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

.item {
  margin-bottom: 18px;
}

.neon-title {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 18px 16px;
  background: rgba(0, 255, 140, 0.08);
  color: #00ff9d;
  font-size: 22px;
  font-weight: 900;
  text-align: center;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow:
    0 0 8px rgba(0, 255, 157, 0.55),
    0 0 18px rgba(0, 255, 157, 0.35),
    inset 0 0 12px rgba(0, 255, 157, 0.12);
  text-shadow:
    0 0 6px rgba(0, 255, 157, 0.9),
    0 0 14px rgba(0, 255, 157, 0.7);
  transition: 0.2s ease;
}

.neon-title:active {
  transform: scale(0.98);
}

.neon-title.active {
  background: rgba(0, 140, 255, 0.12);
  color: #33d9ff;
  box-shadow:
    0 0 10px rgba(51, 217, 255, 0.75),
    0 0 24px rgba(51, 217, 255, 0.45),
    inset 0 0 14px rgba(51, 217, 255, 0.16);
  text-shadow:
    0 0 8px rgba(51, 217, 255, 1),
    0 0 18px rgba(51, 217, 255, 0.75);
}

.image-box {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transform: scale(0.96);
  transition:
    max-height 0.35s ease,
    opacity 0.25s ease,
    transform 0.25s ease;
}

.image-box.show {
  max-height: 500px;
  opacity: 1;
  transform: scale(1);
  margin-top: 14px;
}

.image-box img {
  width: 100%;
  display: block;
  border-radius: 18px;
  box-shadow:
    0 0 12px rgba(0, 255, 157, 0.35),
    0 0 26px rgba(0, 140, 255, 0.25);
}</style><script>const titles = document.querySelectorAll('.neon-title');

titles.forEach(title => {
  title.addEventListener('click', () => {
    const imageBox = title.nextElementSibling;

    title.classList.toggle('active');
    imageBox.classList.toggle('show');
  });
});</script>
